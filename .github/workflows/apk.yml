name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar e sincronizar o Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Gerar APK de depuração
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EventosRua.apk

      - name: Disponibilizar EventosRua.apk
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/EventosRua.apk
          archive: false
          if-no-files-found: error
